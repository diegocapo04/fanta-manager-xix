services:
  # Servizio Database
  db:
    image: mysql:8.0
    container_name: fanta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fanta_net

  # Servizio Web App (Streamlit)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fanta_web
    restart: always
    expose:
      - "8501"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - web_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fanta_net

  # Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: fanta_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - fanta_net

  # Certbot per certificati SSL Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: fanta_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
  web_data:

networks:
  fanta_net:
    driver: bridge
